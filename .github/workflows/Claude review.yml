# Revue automatique par Claude à chaque pull request + assistant à la demande (@claude)
# À placer dans .github/workflows/claude-review.yml
# Prérequis : secret de dépôt CLAUDE_CODE_OAUTH_TOKEN (abonnement Claude, via `claude setup-token`)
#             ou ANTHROPIC_API_KEY (facturation API) — voir la ligne d'authentification plus bas.

name: Claude – revue de code

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # 1) Revue automatique à chaque ouverture / mise à jour de PR
  revue-auto:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          track_progress: true
          prompt: |
            Tu es l'assistant développeur et fonctionnel du propriétaire de ce dépôt, son « second cerveau ».
            Réponds en français.

            Dépôt : ${{ github.repository }} — PR #${{ github.event.pull_request.number }}
            Branche : ${{ github.head_ref }} → ${{ github.base_ref }}

            1. Détecte le type de projet, le langage et le framework, et résume en 3 phrases ce que fait le programme et ce que change la PR.
            2. Vérifie le bon fonctionnement : installe les dépendances, build, lance les tests, le linter et le type-checker s'ils existent.
            3. Sécurité : cherche les vulnérabilités (injections, XSS, secrets en dur, authentification, validation des entrées, dépendances vulnérables). Utilise les outils gratuits disponibles (npm audit, pip-audit, etc.).
            4. Qualité : lisibilité, nommage, duplication, gestion d'erreurs, tests manquants, cohérence avec le style existant. Challenge la logique.
            5. Optimisations et astuces pour gagner du temps.

            Rends un rapport sous forme de liste exhaustive numérotée en continu, en trois sections :
            A. Corrections impératives — B. Suggestions de qualité — C. Optimisations et astuces.
            Pour chaque point : fichier:ligne, problème et pourquoi, correction proposée, testé (oui/non).
            Termine par tes questions sur le fonctionnement du programme.

            Ne pousse aucun commit : propose seulement. L'auteur décidera quels numéros appliquer.
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(npm *),Bash(npx *),Bash(pip *),Bash(python *),Bash(pytest *),Bash(mvn *),Bash(./mvnw *),Bash(gradle *),Bash(./gradlew *),Bash(go *),Bash(cargo *),Bash(git diff *),Bash(git log *),mcp__github_inline_comment__create_inline_comment"

  # 2) Assistant à la demande : écris « @claude ... » dans un commentaire de PR ou d'issue
  assistant:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
